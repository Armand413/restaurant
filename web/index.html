<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Restaurant Connect BF — gestion du restaurant.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="restaurant">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Restaurant Connect BF</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="startup" role="status" style="position:fixed;inset:0;display:grid;place-content:center;gap:16px;padding:24px;text-align:center;background:#f6f8f5;color:#13795b;font:18px system-ui,sans-serif;z-index:10000">
    <strong>Restaurant Connect BF</strong>
    <span id="startup-message">Chargement de l’application…</span>
    <button id="startup-retry" hidden onclick="location.reload()" style="padding:12px;border:0;border-radius:12px;background:#13795b;color:white">Réessayer</button>
  </div>
  <script>
    window.restaurantStartupError = function () {
      const panel = document.getElementById('startup');
      if (!panel) return;
      document.getElementById('startup-message').textContent = 'Le démarrage a échoué. Vérifiez votre connexion puis réessayez.';
      document.getElementById('startup-retry').hidden = false;
    };
    window.addEventListener('error', window.restaurantStartupError);
    window.addEventListener('unhandledrejection', window.restaurantStartupError);
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('startup')?.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async onerror="window.restaurantStartupError()"></script>
</body>
</html>
